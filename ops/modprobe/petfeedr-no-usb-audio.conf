# Installed to /etc/modprobe.d/ by setup-pi.sh.
# The bowl webcam has a built-in microphone. PetFeedr never records sound,
# so the USB audio driver never loads and the mic never becomes a device.
# "install … /bin/false" also refuses a by-hand modprobe, which a blacklist
# alone allows. The Pi's own headphone jack uses snd_bcm2835 and is unaffected.
blacklist snd_usb_audio
install snd_usb_audio /bin/false
